<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Futurista</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* FUNDO FUTURISTA */
        .fundo-futurista {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #1e1b4b 100%);
            z-index: -2;
        }

        .fundo-futurista::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 255, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.12) 0%, transparent 40%);
            animation: brilho 8s infinite alternate;
        }

        @keyframes brilho {
            from { opacity: 0.6; }
            to { opacity: 1; }
        }

        .conteudo {
            position: relative;
            z-index: 1;
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .titulo {
            text-align: center;
            color: #00ffff;
            font-size: 2.5rem;
            margin-bottom: 40px;
            text-shadow: 0 0 15px #00ffff, 0 0 30px rgba(0,255,255,0.4);
        }

        /* GRADE DOS PRATOS */
        .grade-cardapio {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .cartao {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .cartao:hover {
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            transform: translateY(-5px);
        }

        /* IMAGEM COM ZOOM */
        .container-imagem {
            overflow: hidden;
            border-radius: 12px;
            margin-bottom: 15px;
            cursor: zoom-in;
            height: 220px;
        }

        .imagem-prato {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .imagem-prato.zoom {
            transform: scale(1.6);
            cursor: zoom-out;
        }

        .nome-prato {
            color: #fff;
            font-size: 1.3rem;
            margin-bottom: 12px;
        }

        /* BOTÃO ABAIXO DA IMAGEM ✅ */
        .botao-acao {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #00ffff, #a855f7);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            font-size: 1rem;
        }

        .botao-acao:hover {
            transform: scale(1.03);
        }

        /* PAINEL ADMINISTRATIVO */
        .painel-admin {
            background: rgba(30, 27, 75, 0.6);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 16px;
            padding: 25px;
            margin-top: 40px;
        }

        .painel-admin h2 {
            color: #a855f7;
            margin-bottom: 20px;
        }

        .form-admin {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
        }

        .form-admin input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(0,255,255,0.3);
            background: rgba(0,0,0,0.3);
            color: white;
            outline: none;
        }

        .form-admin input:focus {
            border-color: #00ffff;
        }

        .form-admin button {
            padding: 12px;
            background: #00ffff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }

        .item-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: rgba(0,0,0,0.25);
            border-radius: 8px;
            margin-bottom: 8px;
            color: white;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn-editar {
            background: #facc15;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 6px;
        }

        .btn-excluir {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .aviso-senha {
            color: #888;
            font-size: 0.85rem;
            margin-top: 10px;
        }
        
        .admin-secreto {
            position: fixed;
            top: 0;
            right: 0;
            width: 50px;
            height: 50px;
            cursor: pointer;
            opacity: 0;
            z-index: 999;
        }
        
        .modo-admin .painel-admin {
            display: block;
        }
        
        .painel-admin {
            display: none;
        }
    </style>
</head>
<body>
    <div class="fundo-futurista"></div>
    <div class="conteudo">
        <h1 class="titulo">✨ CARDÁPIO FUTURISTA ✨</h1>

        <!-- Área invisível para ativar admin -->
        <div class="admin-secreto" onclick="pedirSenha()"></div>

        <!-- CARDÁPIO -->
        <div class="grade-cardapio" id="grade-cardapio">
            <!-- Os itens aparecem aqui automaticamente -->
        </div>

        <!-- PAINEL ADMINISTRATIVO -->
        <div class="painel-admin">
            <h2>⚙️ Painel de Administração</h2>
            
            <div class="form-admin">
                <input type="text" id="input-nome" placeholder="Nome do prato">
                <input type="text" id="input-imagem" placeholder="Link da imagem (da internet)">
                <input type="text" id="input-musica" placeholder="Link da música MP3 (opcional)">
                <button id="btn-adicionar">➕ Adicionar Novo Prato</button>
            </div>

            <h3 style="color:#ccc; margin:15px 0 10px;">Editar / Remover:</h3>
            <div id="lista-admin">
                <!-- Itens de edição aparecem aqui -->
            </div>
            
            <p class="aviso-senha">Para sair do modo admin, recarregue a página</p>
        </div>
    </div>

    <!-- Áudio para música -->
    <audio id="player-musica" preload="auto">

    <script>
        const SENHA = "admin123";
        let modoAdmin = false;
        let cardapio = [];

        // Carregar dados salvos
        function carregarCardapio() {
            const salvo = localStorage.getItem('cardapio');
            if (salvo) {
                cardapio = JSON.parse(salvo);
            } else {
                // Exemplo inicial
                cardapio = [
                    {
                        id: 1,
                        nome: "Prato de Exemplo",
                        imagem: "https://via.placeholder.com/400x250/0f172a/00ffff?text=Meu+Prato",
                        musica: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
                    }
                ];
                salvarCardapio();
            }
            renderizarCardapio();
        }

        function salvarCardapio() {
            localStorage.setItem('cardapio', JSON.stringify(cardapio));
        }

        // Renderizar todos os pratos
        function renderizarCardapio() {
            const grade = document.getElementById('grade-cardapio');
            const listaAdmin = document.getElementById('lista-admin');
            grade.innerHTML = '';
            listaAdmin.innerHTML = '';

            cardapio.forEach(item => {
                // Cartão do cliente
                const cartao = document.createElement('div');
                cartao.className = 'cartao';
                cartao.setAttribute('data-musica', item.musica || '');
                cartao.innerHTML = `
                    <div class="container-imagem">
                        <img src="${item.imagem}" alt="${item.nome}" class="imagem-prato" onclick="this.classList.toggle('zoom')">
                    </div>
                    <h3 class="nome-prato">${item.nome}</h3>
                    <button class="botao-acao">Ver Detalhes</button>
                `;
                grade.appendChild(cartao);

                // Item de administração
                if (modoAdmin) {
                    const adminItem = document.createElement('div');
                    adminItem.className = 'item-admin';
                    adminItem.innerHTML = `
                        <strong>${item.nome}</strong>
                        <div>
                            <button class="btn-editar" onclick="editarItem(${item.id})">✏️ Editar</button>
                            <button class="btn-excluir" onclick="excluirItem(${item.id})">🗑️ Remover</button>
                        </div>
                    `;
                    listaAdmin.appendChild(adminItem);
                }
            });

            // Ativar função de música nos cartões
            ativarMusicaHover();
        }

        // 🎵 Música ao passar o mouse
        function ativarMusicaHover() {
            const player = document.getElementById('player-musica');
            document.querySelectorAll('.cartao').forEach(cartao => {
                const musicaUrl = cartao.getAttribute('data-musica');
                
                cartao.addEventListener('mouseenter', () => {
                    if (musicaUrl) {
                        player.src = musicaUrl;
                        player.currentTime = 0;
                        player.volume = 0.5;
                        player.play().catch(() => {});
                    }
                });

                cartao.addEventListener('mouseleave', () => {
                    player.pause();
                    player.currentTime = 0;
                });
            });
        }

        // 🔐 Pedir senha
        function pedirSenha() {
            if (modoAdmin) return;
            const senha = prompt('Digite a senha de administração:');
            if (senha === SENHA) {
                modoAdmin = true;
                document.body.classList.add('modo-admin');
                renderizarCardapio();
                alert('✅ Modo administrador ativado!');
            } else if (senha !== null) {
                alert('❌ Senha incorreta!');
            }
        }

        // ➕ Adicionar novo prato
        document.getElementById('btn-adicionar').addEventListener('click', () => {
            if (!modoAdmin) return alert('Acesso restrito! Clique no canto superior direito para entrar.');
            
            const nome = document.getElementById('input-nome').value.trim();
            const imagem = document.getElementById('input-imagem').value.trim();
            const musica = document.getElementById('input-musica').value.trim();

            if (!nome || !imagem) {
                return alert('Preencha o Nome e a Imagem!');
            }

            const novoId = cardapio.length > 0 ? Math.max(...cardapio.map(i => i.id)) + 1 : 1;
            cardapio.push({
                id: novoId,
                nome: nome,
                imagem: imagem,
                musica: musica
            });

            salvarCardapio();
            renderizarCardapio();

            // Limpar campos
            document.getElementById('input-nome').value = '';
            document.getElementById('input-imagem').value = '';
            document.getElementById('input-musica').value = '';

            alert(`✅ "${nome}" adicionado!`);
        });

        // ✏️ Editar
        function editarItem(id) {
            const item = cardapio.find(i => i.id === id);
            if (!item) return;

            const novoNome = prompt('Novo nome:', item.nome);
            if (!novoNome) return;

            const novaImagem = prompt('Nova imagem:', item.imagem);
            if (!novaImagem) return;

            const novaMusica = prompt('Nova música:', item.musica || '');
            if (novaMusica === null) return;

            item.nome = novoNome;
            item.imagem = novaImagem;
            item.musica = novaMusica;

            salvarCardapio();
            renderizarCardapio();
            alert('✅ Atualizado!');
        }

        // 🗑️ Excluir
        function excluirItem(id) {
            if (!confirm('Tem certeza?')) return;
            cardapio = cardapio.filter(i => i.id !== id);
            salvarCardapio();
            renderizarCardapio();
            alert('✅ Removido!');
        }

        // Iniciar
        carregarCardapio();
    </script>
</body>
</html>
